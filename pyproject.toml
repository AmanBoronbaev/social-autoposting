[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoposting-platform"
version = "0.1.0"
description = "Multi-tenant social publishing service"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<0.141",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0.36,<3",
  "starlette>=0.46,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI declares dependencies in signatures.
